[package]
name = "swarms-rs-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Pinned to the release that was benchmarked. To benchmark a local checkout instead:
# swarms-rs = { path = "/path/to/swarms-rs/swarms-rs" }
swarms-rs = "=0.3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
